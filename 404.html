<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0e0d0c" />
  <title>Page not found — Aura &amp; Essence</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#0e0d0c; --parchment:#ede7da; --dim:#b9b0a0; --gold:#d4b26a; --line:rgba(212,178,106,.22); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 32px 24px;
      background: radial-gradient(80% 60% at 15% 0%, rgba(212,178,106,.10), transparent 60%),
                  radial-gradient(70% 60% at 90% 100%, rgba(58,20,32,.35), transparent 60%), var(--ink);
      color: var(--parchment); font-family: "Jost", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    }
    main { width: min(560px, 100%); text-align: center; }
    .logo { width: 72px; height: auto; opacity: .95; }
    .code { margin: 34px auto 0; padding-left: .34em; font-size: 11px; letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
    h1 { margin: 16px 0 0; font-family: "Cormorant Garamond", serif; font-weight: 300; font-size: clamp(44px, 9vw, 72px); line-height: 1; }
    h1 em { display: block; color: var(--gold); font-weight: 300; }
    p { margin: 22px auto 0; max-width: 40ch; color: var(--dim); line-height: 1.7; font-weight: 300; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 36px; }
    a.btn {
      display: inline-block; padding: 15px 26px; min-height: 48px; border: 1px solid var(--line); border-radius: 2px;
      color: var(--parchment); text-decoration: none; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
      transition: border-color .3s, color .3s, background .3s;
    }
    a.btn:hover { border-color: var(--gold); color: var(--gold); }
    a.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--ink); }
    a.btn.primary:hover { background: transparent; color: var(--gold); }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/images/ae-logo-gold.svg" alt="Aura &amp; Essence" width="72" height="72" />
    <p class="code">Error 404</p>
    <h1>This page<em>wandered off</em></h1>
    <p>The link may be old or mistyped. Let's get you back to the collection.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to home</a>
      <a class="btn" href="/?line=men">Shop for him</a>
      <a class="btn" href="/?line=women">Shop for her</a>
    </div>
  </main>
</body>
</html>
